name: Web Studio
on:
  push:
    branches: [main, feature/multiseed-results-workspace]
    paths:
      - 'src/atima_fl/ui/static/**'
      - 'scripts/build_web_studio.py'
      - 'scripts/check_web_studio.py'
      - '.github/workflows/web-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atima-web-studio
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build allowlisted static site
        run: python scripts/build_web_studio.py _site
      - name: Check JavaScript and local reader
        run: |
          for f in _site/*.js; do node --check "$f"; done
          node tests/js/local-results.test.cjs
          node tests/js/results.test.cjs
      - name: Test in Chromium with network blocked
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/check_web_studio.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: atima-web-studio
          path: _site
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: github.repository == 'CarSor16/ATIMA-FL' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/multiseed-results-workspace')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (enable if repository token is authorized)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy tested static assets
        id: deployment
        uses: actions/deploy-pages@v4
