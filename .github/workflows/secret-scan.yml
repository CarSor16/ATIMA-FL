name: Secret scanning
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks release
        shell: bash
        run: |
          set -euo pipefail
          version=8.28.0
          filename="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$filename" "$base/$filename"
          curl --fail --silent --show-error --location --output checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep -F "  $filename" checksums.txt | sha256sum --check --strict
          tar -xzf "$filename" gitleaks
      - name: Scan current checkout and reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir --redact=100 --no-banner .
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
