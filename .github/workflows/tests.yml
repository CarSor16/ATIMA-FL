name: Software verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  designer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_ui.py -q
      - name: Bootstrap and diagnose Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\Avvia_ATIMA_FL.cmd -Doctor
          if ($LASTEXITCODE -ne 0) { throw 'ATIMA launcher failed bootstrap' }
          .\Avvia_ATIMA_FL.cmd -Doctor -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'ATIMA launcher failed read-only checks' }
  scientific-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[training,flower,analysis,dev]'
      - run: ruff check src tests
      - run: python -m pytest -q
