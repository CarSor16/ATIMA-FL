name: Software verification
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request]
permissions:
  contents: read
jobs:
  designer:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_ui.py tests/test_ui_results_behavior.py -q
      - name: Validate browser JavaScript syntax
        run: |
          node --check src/atima_fl/ui/static/app.js
          node --check src/atima_fl/ui/static/i18n.js
          node --check tests/js/results.test.cjs
      - name: Bootstrap and diagnose Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\Avvia_ATIMA_FL.cmd -Doctor
          if ($LASTEXITCODE -ne 0) { throw 'ATIMA launcher failed bootstrap' }
          .\Avvia_ATIMA_FL.cmd -Doctor -NoInstall
          if ($LASTEXITCODE -ne 0) { throw 'ATIMA launcher failed read-only checks' }
      - name: Verify Windows launcher reuses existing configured workspace
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $previous = $env:ATIMA_WORKSPACE
          $env:ATIMA_WORKSPACE = ''
          $configured = Join-Path (Split-Path -Parent (Get-Location).Path) 'Workspace_ATIMA'
          New-Item -ItemType Directory -Force -Path $configured | Out-Null
          Set-Content -LiteralPath (Join-Path $configured 'cluster_connection.json') -Value '{}' -Encoding utf8
          try {
            $output = & .\Avvia_ATIMA_FL.cmd -Doctor -NoInstall 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw $output }
            if (-not $output.Contains("[ATIMA] Workspace: $configured")) {
              throw "Launcher did not reuse Workspace_ATIMA: $output"
            }
            $manual = & .\Avvia_ATIMA_FL.cmd -Doctor -NoInstall -Workspace $env:RUNNER_TEMP 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw $manual }
            if (-not $manual.Contains("[ATIMA] Workspace: $env:RUNNER_TEMP")) {
              throw "Explicit workspace was ignored: $manual"
            }
          } finally {
            $env:ATIMA_WORKSPACE = $previous
          }
  scientific-software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[training,flower,analysis,dev]'
      - run: ruff check src tests
      - run: python -m pytest -q
