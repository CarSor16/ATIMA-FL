[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atima-studio"
version = "0.5.2"
description = "ATIMA local experiment designer and portable plan exporter"
requires-python = ">=3.11,<3.13"
dependencies = ["atima-core==0.5.2"]

[project.scripts]
atima-studio = "atima_fl.studio.cli:main"

[tool.hatch.build.targets.wheel]
only-include = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/atima_fl/studio" = "atima_fl/studio"
"../../src/atima_fl/ui" = "atima_fl/ui"
